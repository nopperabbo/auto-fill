<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 0; padding: 10px; }
  h1 { font-size: 13px; margin: 0 0 8px; color: #444; }
  select, button { width: 100%; padding: 6px 8px; font-size: 13px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
  button { background: #635bff; color: #fff; border: 0; cursor: pointer; margin-top: 6px; font-weight: 500; }
  button.submit { background: #c41e3a; }
  button.ghost { background: transparent; color: #666; border: 1px solid #ddd; }
  label { display: block; font-size: 11px; color: #666; margin: 8px 0 3px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > * { flex: 1; }
  #status { margin-top: 8px; font-size: 11px; color: #666; min-height: 28px; white-space: pre-wrap; }
  #status.ok { color: #1a7f37; }
  #status.err { color: #b91c1c; }
  hr { border: 0; border-top: 1px solid #eee; margin: 10px 0; }
  textarea { width: 100%; height: 160px; font-family: Menlo, monospace; font-size: 11px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; padding: 6px; display: none; }
  textarea.show { display: block; }
</style>
</head>
<body>
<h1>Auto Fill</h1>

<label for="profile">Profile</label>
<select id="profile"></select>

<button id="fill">Fill</button>
<button id="fillSubmit" class="submit">Fill + Submit</button>

<div id="status"></div>

<hr>
<button id="toggleEdit" class="ghost">Edit profiles JSON</button>
<textarea id="editor" spellcheck="false"></textarea>
<div class="row" id="editRow" style="display:none">
  <button id="save">Save</button>
  <button id="cancel" class="ghost">Cancel</button>
</div>

<script src="popup.js"></script>
</body>
</html>
