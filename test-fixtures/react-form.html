<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>React Controlled Form — Fixture</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { font: 15px system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
  input, select { display: block; width: 100%; padding: .4rem; margin: .3rem 0 .6rem; box-sizing: border-box; }
  button { padding: .5rem 1rem; }
  pre { background: #f5f5f5; padding: .6rem; border-radius: 4px; }
</style>
</head>
<body>
<h1>React Controlled Form</h1>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function PaymentForm() {
  const [state, setState] = useState({
    cardnumber: '',
    'cc-exp': '',
    cvc: '',
    ccname: '',
    country: '',
    'address-line1': '',
    city: '',
    state: '',
    postal: '',
  });
  const [submitted, setSubmitted] = useState(null);

  const update = (k) => (e) => setState({ ...state, [k]: e.target.value });

  return (
    <form onSubmit={(e) => { e.preventDefault(); setSubmitted(state); document.title = 'React Submitted ✓'; }}>
      <input name="cardnumber" autoComplete="cc-number" placeholder="Card number" value={state.cardnumber} onChange={update('cardnumber')} />
      <input name="cc-exp" autoComplete="cc-exp" placeholder="MM / YY" value={state['cc-exp']} onChange={update('cc-exp')} />
      <input name="cvc" autoComplete="cc-csc" placeholder="CVC" value={state.cvc} onChange={update('cvc')} />
      <input name="ccname" autoComplete="cc-name" placeholder="Cardholder" value={state.ccname} onChange={update('ccname')} />
      <select name="country" autoComplete="country" value={state.country} onChange={update('country')}>
        <option value="">Select…</option>
        <option value="ID">Indonesia</option>
        <option value="US">United States</option>
      </select>
      <input name="address-line1" autoComplete="address-line1" placeholder="Address" value={state['address-line1']} onChange={update('address-line1')} />
      <input name="city" autoComplete="address-level2" placeholder="City" value={state.city} onChange={update('city')} />
      <input name="state" autoComplete="address-level1" placeholder="Province" value={state.state} onChange={update('state')} />
      <input name="postal" autoComplete="postal-code" placeholder="Postal" value={state.postal} onChange={update('postal')} />
      <button type="submit">Pay</button>
      {submitted && <pre id="out">{JSON.stringify(submitted, null, 2)}</pre>}
    </form>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PaymentForm />);
</script>
</body>
</html>
